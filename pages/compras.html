<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tus Compras - MARKET.CL</title>
    <link rel="icon" type="image/png" href="../img/png-clipart-shopping-cart-shopping-cart (1).png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <div id="nav-container"></div>

    <main class="container mt-5 mb-5" style="min-height: 60vh;">
      <div class="row">
        <h2 class="mt-3 mb-4 text-center">Mi Carrito de Compras</h2>
      </div>

      <div class="table-responsive shadow-sm bg-white rounded">
        <table id="tablaCarrito" class="table table-striped table-hover text-center mb-0">
          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>Producto</th>
              <th>Precio Unitario</th>
              <th>Cantidad</th>
              <th>Subtotal</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
      </div>

      <div class="row justify-content-end mt-4">
        <div class="col-md-5 text-end">
          <div class="d-flex justify-content-end align-items-center mb-2">
            <input type="text" id="codigoDescuento" class="form-control w-50 me-2" placeholder="Ingresa INACAP10">
            <button class="btn btn-outline-primary" onclick="aplicarDescuento()">Aplicar</button>
          </div>
          <div id="mensajeDescuento" class="mb-3"></div>
          
          <h3 class="fw-bold">Total a Pagar: $<span id="totalCompra" class="text-success">0</span></h3>
          <button class="btn btn-success btn-lg mt-2 w-100">Proceder al Pago</button>
        </div>
      </div>
    </main>

    <div id="footer-container"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
