<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Perfil - MARKET.CL</title>
    
    <link rel="icon" type="image/png" href="../img/png-clipart-shopping-cart-shopping-cart (1).png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <div id="nav-container"></div>

    <main class="container mt-5 mb-5" style="max-width: 500px;">
      <h2 class="text-center mb-4">Mi Perfil</h2>
      
      <div id="contenido-perfil">
        
        <div id="caja-login" class="card shadow-sm p-4">
          <h4 class="text-center mb-4">Iniciar Sesión</h4>
          <form id="formLogin">
            <div class="mb-3">
              <label class="form-label fw-bold">Correo Electrónico</label>
              <input type="email" class="form-control" id="loginCorreo" placeholder="Escribe tu correo...">
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Contraseña</label>
              <input type="password" class="form-control" id="loginPassword" placeholder="Ingresa tu contraseña..">
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            <div id="msgLogin" class="mt-2 text-center fw-bold"></div>
          </form>
          <hr class="mt-4">
          <div class="text-center">
            <button class="btn btn-link" onclick="mostrar('caja-registro')">Regístrate aquí</button>
          </div>
        </div>

        <div id="caja-registro" class="card shadow-sm p-4 oculto">
          <h4 class="text-center mb-4">Crear Cuenta</h4>
          <form id="formRegistro">
            <div class="mb-3">
              <label class="form-label fw-bold">Nombre</label>
              <input type="text" class="form-control" id="regNombre" placeholder="Juan perez">
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Correo</label>
              <input type="email" class="form-control" id="regCorreo" placeholder="example@mail.com">
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Contraseña</label>
              <input type="password" class="form-control" id="regPassword" placeholder="Crea una contraseña">
            </div>
            <button type="submit" class="btn btn-success w-100">Registrarse</button>
            <div id="msgRegistro" class="mt-2 text-center fw-bold"></div>
          </form>
          <hr class="mt-4">
          <div class="text-center">
            <button class="btn btn-link" onclick="mostrar('caja-login')">Inicia sesión</button>
          </div>
        </div>

      </div>
    </main>

    <div id="footer-container"></div>

    <script src="../js/app.js"></script>
  </body>
</html>
