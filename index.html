<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MARKET.CL</title>
    <link
      rel="icon"
      type="image/png"
      href="img/png-clipart-shopping-cart-shopping-cart (1).png"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Navbar -->
    <div id="nav-container"></div>

    <!-- Container -->
    <div class="container">
      <h2 class="mt-3 text-center">Bienvendidos a la Tienda</h2>
    </div>

    <div id="miCarrusel" class="carousel slide mt-3" data-bs-ride="carousel">
      
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="/img/carrusel/1366_2000.jpg" class="d-block w-100" style="max-height: 400px; object-fit: cover" alt="Auriculares"/>
          <div class="carousel-caption d-none d-md-block centrar-texto-carrusel">
            <h5>Auriculares</h5>
            <p>Lleva tu primera colección de auriculares</p>
          </div>
        </div>
        <div class="carousel-item">
          <img src="/img/carrusel/1366_2000 (1).jpg" class="d-block w-100" style="max-height: 400px; object-fit: cover" alt="Setup"/>
          <div class="carousel-caption d-none d-md-block centrar-texto-carrusel">
            <h5>Arma tu propio Setup</h5>
            <p>En MARKET.CL puedes encontrar todo lo que buscas.</p>
          </div>
        </div>
        <div class="carousel-item">
          <img src="/img/carrusel/Blog_Portada_HS_1046x697-portada.jpg" class="d-block w-100" style="max-height: 400px; object-fit: cover" alt="Home Studio"/>
          <div class="carousel-caption d-none d-md-block centrar-texto-carrusel">
            <h5>¿HOME STUDIO?</h5>
            <p>¡Sí! también contamos con productos de música y sonido.</p>
          </div>
        </div>
      </div>

      <button class="carousel-control-prev" type="button" data-bs-target="#miCarrusel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#miCarrusel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
      </button>
    </div>

    <div class="container mt-5">
      <h3 class="mb-4">Lo más vendido</h3>
      
      <div class="row" id="contenedor-productos">
        
      </div>
    </div>

    <!-- Footer -->
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/app.js"></script>
  </body>
</html>
